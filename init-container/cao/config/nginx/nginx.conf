user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    #default_type  application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    #tcp_nopush     on;
    #keepalive_timeout  65;
    gzip  on;
    include /etc/nginx/conf.d/*.conf;
	client_max_body_size 0;

    proxy_http_version 1.1;

    server {
    	server_name contrabass.os;
    	listen 80;
     	return 301 https://$host$request_uri;
    }
    server {
        server_name contrabass.os;
        listen 9443 ssl;
        http2 on;

        ssl_certificate /root/cert.pem;
        ssl_certificate_key /root/key.pem;


        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers "ECDHE-RSA-AES128-SHA256:AES256-GCM-SHA384:TLS-AES-256-GCM-SHA384";
        ssl_prefer_server_ciphers on;

        #large_client_header_buffers 4 32k;
        proxy_busy_buffers_size   512k;
                proxy_buffers   4 256k;
                proxy_buffer_size   256k;

        location /auth {
                proxy_pass http://keycloak:9443/auth;
                proxy_redirect off;
                proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $remote_addr;
                proxy_set_header X-Forwarded-Proto $scheme;
                        #추가
                proxy_set_header X-Forwarded-Port 9443;
                }
        location /oauth2/ {
                proxy_pass       http://oauth2-proxy:4180;
                proxy_set_header Host                    $host;
                proxy_set_header X-Real-IP               $remote_addr;
                        proxy_set_header X-Scheme                $scheme;
                        proxy_set_header X-Auth-Request-Redirect $request_uri;
                proxy_set_header X-Forwarded-Uri $request_uri;
                        proxy_set_header X-Forwarded-Port 9443;
                # or, if you are handling multiple domains:
                #proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;

                # Server Snippet Equivalent
                proxy_intercept_errors on;

                if ($request_uri ~* "^/oauth2") {
                error_page 403 =302 /oauth2/sign_in?rd=$request_uri;
                #error_page 403 =302 /oauth2/sign_in?rd=%2F;
                }
        }

        location /v1/maestro/admin/log-out {
               proxy_pass http://maestro-auth-gateway:8080/v1/maestro/admin/log-out;
               # 인증된 사용자 정보 설정
        auth_request_set $user   $upstream_http_x_auth_request_user;
        auth_request_set $email  $upstream_http_x_auth_request_email;
        auth_request_set $token  $upstream_http_x_auth_request_access_token;

        # 백엔드에 전달할 헤더 설정
        proxy_set_header X-User  $user;
        proxy_set_header X-Email $email;
        proxy_set_header X-Access-Token $token;
        proxy_set_header X-Forwarded-Port 9443;
        proxy_pass_request_headers on;

        # 쿠키 전달을 위한 설정 (OAuth2 Proxy에서 받은 쿠키 유지)
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        if ($auth_cookie) {
            add_header Set-Cookie $auth_cookie always;
        }
              
              
         }

        location = /oauth2/auth {
                 error_page 401 =302 /oauth2/sign_in; #수정
                #internal;
                proxy_pass       http://oauth2-proxy:4180;
                proxy_set_header Host             $host;
                proxy_set_header X-Real-IP        $remote_addr;
                proxy_set_header X-Scheme         $scheme;
                        proxy_set_header X-Forwarded-Port 9443;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Auth-Request-Redirect $request_uri;
                proxy_set_header X-Forwarded-Uri $request_uri;

                # nginx auth_request includes headers but not body
                proxy_set_header Content-Length   "";
                proxy_pass_request_body           off;

                # 쿠키 전달
                auth_request_set $auth_cookie $upstream_http_set_cookie;
                add_header Set-Cookie $auth_cookie always;

        }
                include /etc/nginx/upstream_rules.conf;
    }
}

