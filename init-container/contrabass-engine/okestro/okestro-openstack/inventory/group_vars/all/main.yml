##################
# Baremetal init #
##################
#----------------------------------------
int_api_interface: ens3
internal_vip_address: 10.255.191.150
internal_vip_cidr: 24
#----------------------------------------
external_api_interface: ens4
external_vip_address: 10.255.192.150
external_vip_cidr: 24
#----------------------------------------
monitoring_network_interface: ens4
monitoring_vip_address: 10.255.192.150
monitoring_vip_cidr: 24
#----------------------------------------
#package_ip: 10.255.115.10/suse-9.4
package_ip: 119.205.217.187/ubuntu-24.04-1
#package_ip: 119.205.217.187/suse-9.4
ntp_server: 10.255.191.151
# This openstack-deploy ansible support "caracal / epoxy" version
openstack_version: 'yoga'
#openstack_version: 'epoxy'

###############################################################
# API and Ceph Network Subnet & Create VM Contrabass or Viola #
###############################################################
#Define API & Ceph VM Network 
API_SUBNET_START: [API Subnet Start]  # Define API-Network Subnet Start & End
API_SUBNET_END: [API Subnet End]
Ceph_SUBNET_START: [Ceph Subnet Start]  # Define Ceph-Network Subnet Start & End
Ceph_SUBNET_END: [Ceph Subnet End]

#Deploy Contrabass or Viola Instance Option
Contrabass: false  # If you Create Contrabass VM define True
Viola: false        # if you Create Viola VM define True


####################
# Password setting #
####################
# "server_password" must set baremetal root password (For ssh copy)
ipmi_user: Administrator #[BMC ID]
ipmi_password: Cloud1234 #[BMC password]
server_password: Cloud1234 #[OS root password]
haproxy_pwd: Cloud1234 #[hacluster user password]
rabbitmq_password: Cloud1234 #[RabbitMQ openstack user password]
keystone_pass: Cloud1234 #[Keystone admin password]
minio_root_user: minioadmin #[MinIO admin user ID]
minio_root_password: Cloud1234 #[MinIO admin user password]
s3_access_key: monitoring #[MinIO object bucket access key]
s3_secret_key: Cloud1234 #[MinIO object bucket secret key]

# [Percona DB password] Min 8 chars / Must include uppercase, lowercase, number, and special character
# !! Deployment will FAIL if special characters other than the ones listed below are used
#
#    Allowed special characters →  ~  !  (  )  -  _  +  *  &
#
# e.g.) 'Openstack1@'  ← NOT allowed (@ is not permitted)  /  'Openstack1!'  ← OK
db_password: Cloud1234! #[Percona DB password]


###########################
# MinIO S3 device setting #
###########################
# Must set one physical device
minio_device: /dev/sdc #[MinIO Object store physical device]

###########
# neutron #
###########
bridges:
  - name: external #[Openstack provider network alias]
    port: ens9 #[OVS bridge mapped physical port]
#   vlan: 1000 #[Vlan tag if provider network need vlan tag]
# - name: nas
#   bridge: br-nas
#   port: ens37
#   ...

#### If use VLAN, Define VLAN VALUES ####
use_vlan: false
vlans:
  - name: external #[Openstack provider network alias]
    range_min: 500 #[Vlan minimum range]
    range_max: 999 #[Vlan maximum range]
# - name: mgmt
#   range_min: 300
#   range_max: 300
#   ...
###### Create Network on openstack of use Vlan or Flat Guide #####
Provider_Name: external # Copy neutron briges name               #
Network_Type: vlan  # Define Openstack Network Type              #
Vlan_Tag: 20    # Define Network Vlan Tag                        #
##################################################################

################
# nova-compute #
################
cpu_allocation_ratio: 2.0 #[CPU virtualization ratio]

##########
# cinder #
##########
cinder_backend: "lvm" #[Cinder backend section]
cinder_backend_name: "kyj-lvm" #[Cinder-volume backend name]
############### Define Contrabass Storage Backend ###################
# [ Storage List : Dell(DL),Netapp(NA),HPE,IBM,Ceph,Hitach... ]     #
# Example : [Main or DR]_[Company]_[Model]_[Pool Type]_[env]_[Num]  #
# ex) : Main_HPE_ceph_01_ssd_prd, DR_DL,powerflex_ssd_stg...        #
#####################################################################
enable_cinder_backend_nfs: false
enable_cinder_custom_backend: false
cinder_custom_conf: |

###############################
# Openstack component enables #
###############################
# Default enabled components: keystone, glance, placement, nova, neutron, cinder, horizon, octavia, barbican, masakari
enable_swift: true
enable_manila: true
enable_masakari_only: true

###############
# Certificate #
###############
# All Components have the TLS option enabled by default.
# If you do not want to use it, edit the all.yml file
# Switch to v3.0.6 default option.
enable_live_migration_tls: false

#################################
# Log / Metric retention period #
#################################
loki_retention_period: '30d' # Log data rentention period, default '30d'
thanos_retention_period: '5d'
thanos_5m_downsample_retention_period: '10d'
thanos_1h_downsample_retention_period: '10d'

#################################
# Thanos Compact timer base time (OnCalendar)
#################################
# Defines the base time for the thanos-compact systemd timer.
# Thanos Compactor will run daily at this base time on each controller node.
# Each controller node will be offset by +10 minutes per index
# Example:
#   controller[0] -> 02:00:00
#   controller[1] -> 02:10:00
#   controller[2] -> 02:20:00
thanos_compact_base_hour: 2
thanos_compact_base_minute: 0

#########################
# Purge Ansible Setting #
#########################
# If true, reboot nodes after purge tasks complete.
# Default false to avoid unintended reboots; set true only when you explicitly want a reboot cycle.
purge_reboot_enabled: false
# If true, run Ceph purge workflow as part of purge-cluster.
# This includes cephadm-based cluster removal / OSD zapping steps on Ceph backend nodes.
# Set false when the cluster does not use Ceph as a backend
purgecluster_backend_ceph: true

