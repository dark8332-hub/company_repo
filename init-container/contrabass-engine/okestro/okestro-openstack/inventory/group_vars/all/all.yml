#Octavia
pac_octavia_api: "{{ 'octavia-api' if ansible_os_family == 'Debian' else 'openstack-octavia-api' }}"
pac_octavia_health_manager: "{{ 'octavia-health-manager' if ansible_os_family == 'Debian' else 'openstack-octavia-health-manager' }}"
pac_octavia_housekeeping: "{{ 'octavia-housekeeping' if ansible_os_family == 'Debian' else 'openstack-octavia-housekeeping' }}"
pac_octavia_worker: "{{ 'octavia-worker' if ansible_os_family == 'Debian' else 'openstack-octavia-worker' }}"
pac_octavia_dashboard: "{{ 'python3-octavia-dashboard' if ansible_os_family == 'Debian' else 'openstack-octavia-ui' }}"
pac_octavia_dhclient: "{{ 'isc-dhcp-client' if ansible_os_family == 'Debian' else 'dhclient' }}"
octavia_dir: "/etc/octavia"
octavia_config: "octavia.conf"
octavia_health_manager_ip: >-
  {{- (inventory_hostname == groups["controller"][0] and '172.16.0.2' or
      inventory_hostname == groups["controller"][1] and '172.16.0.3' or
      inventory_hostname == groups["controller"][2] and '172.16.0.4') -}}
