#Manila
pac_manila_api: "{{ 'manila-api' if ansible_os_family == 'Debian' else 'openstack-manila' }}"
pac_manila_scheduler: "{{ 'manila-scheduler' if ansible_os_family == 'Debian' else 'openstack-manila' }}"
pac_manila_share: "{{ 'manila-share' if ansible_os_family == 'Debian' else 'openstack-manila-share' }}"
pac_manila_ui: "{{ 'python3-manila-ui' if ansible_os_family == 'Debian' else 'openstack-manila-ui' }}"
