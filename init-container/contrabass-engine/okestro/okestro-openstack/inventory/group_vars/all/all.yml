#Masakari
masakari_dir: "/etc/masakari"
masakari_config: "masakari.conf"
masakari_owner: "{{ 'masakari' if ansible_os_family == 'Debian' else 'root' }}"
masakarimonitor_dir: "/etc/masakarimonitors"
masakarimonitor_config: "masakarimonitors.conf"
serv_masakari_api: "{{ 'apache2' if ansible_os_family == 'Debian' else 'masakari-api' }}"
pac_resource_agent: "{{ 'pacemaker-resource-agents' if ansible_os_family == 'Debian' else 'resource-agents' }}"
serv_pacemaker_remote: "{{ 'pacemaker-remote' if ansible_os_family == 'Debian' else 'pacemaker_remote' }}"
masakarimonitor_user: "{{ 'masakarimonitors' if ansible_os_family == 'Debian' else 'root' }}"
existing_compute_count: "{{ groups['compute'] | default([]) | length | int }}"
new_compute_count: "{{ groups['new-compute'] | default([]) | length | int }}"
remote_process: >-
  {{
    'remote'
    if (existing_compute_count | int >= 5) or (new_compute_count | int >= 2)
    else 'cluster'
  }}

masakari_member: "{{ groups['compute'] | difference(groups['controller']) | join(' ') }}"
masakari_dashboard: >
  {% if openstack_version == 'yoga' %}
  masakari-dashboard
  {% elif openstack_version == 'wallaby' %}
  masakari-dashboard-wallaby
  {% endif %}

enable_process_monitor: false
enable_instance_monitor: false
masakari_port: "15868"
masakari_bind_port: "15900"

