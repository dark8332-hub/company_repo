octavia_amphora_img_name: "octavia-amphora-haproxy-2024.1-qemu.qcow2"
octavia_python_path: "{{ '/usr/lib/python3/dist-packages/octavia' if ansible_os_family == 'Debian' else '/usr/lib/python3.9/site-packages/octavia' }}"
octavia_port: "9876"
octavia_bind_port: "19876"

#Ceph
ceph_dir: "/etc/ceph"
ceph_config: "ceph.conf"
images_pool: 32
volumes_pool: 64
