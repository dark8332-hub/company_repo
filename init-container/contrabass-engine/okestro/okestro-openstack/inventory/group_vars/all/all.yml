#ENVIRONMENT
cloud: "contrabass"
openstack_version: "yoga"
repo_file: "{{ 'sources.list' if ansible_os_family == 'Debian' else 'local.repo' }}"
repo_dir: "{{ '/etc/apt' if ansible_os_family == 'Debian' else '/etc/yum.repos.d' }}"
repo_key_dir: "{{ '/etc/apt/trusted.gpg.d/' if ansible_os_family == 'Debian' else '/etc/pki/rpm-gpg/' }}"
host_file: "/etc/hosts"
timezone: "Asia/Seoul"
chrony_config: "chrony.conf"
chrony_config_path: "{{ '/etc/chrony/chrony.conf' if ansible_os_family == 'Debian' else '/etc/chrony.conf' }}"
ntp_allow_network: "0/0"
ceph_ansible_dir: "/root/okestro/ceph-ansible"

#CERTIFICATE
certificates_dir: "/opt/certificate"
root_dir: "{{ certificates_dir }}/rootCA"
root_key: "rootCA.key"
root_crt: "rootCA.crt"
root_pem: "rootCA.pem"
external_dir: "{{ certificates_dir }}/external"
internal_dir: "{{ certificates_dir }}/internal"
openstack_int_key: "{{ cloud }}_int.key"
openstack_int_csr: "{{ cloud }}_int.csr"
openstack_int_crt: "{{ cloud }}_int.crt"
openstack_int_pem: "{{ cloud }}_int.pem"
openstack_int_cert_config: "openssl-internal.cnf"
openstack_int_key_pem: "{{ cloud }}_int_key.pem"
openstack_int_crt_pem: "{{ cloud }}_int_crt.pem"
openstack_ext_key: "{{ cloud }}_ext.key"
openstack_ext_csr: "{{ cloud }}_ext.csr"
openstack_ext_crt: "{{ cloud }}_ext.crt"
openstack_ext_pem: "{{ cloud }}_ext.pem"
openstack_ext_cert_config: "openssl-external.cnf"
openstack_ext_key_pem: "{{ cloud }}_ext_key.pem"
openstack_ext_crt_pem: "{{ cloud }}_ext_crt.pem"
internal_pem: "internal.pem"
external_pem: "external.pem"
local_trusted_cert_dir: "{{ '/usr/local/share/ca-certificates/' if ansible_os_family == 'Debian' else '/etc/pki/ca-trust/source/anchors/' }}"
local_trusted_cert: "{{ 'update-ca-certificates' if ansible_os_family == 'Debian' else 'update-ca-trust extract' }}"
local_trust_cert_dir: "{{ '/etc/ssl/certs' if ansible_os_family == 'Debian' else '/etc/pki/ca-trust/extracted/pem' }}"
local_trust_cert: "{{ root_pem if ansible_os_family == 'Debian' else root_crt }}"
libvirt_ca_dir: "/etc/pki/libvirt"
root_ca_dir: "/etc/pki/CA"
tls_migration_dir: "/opt/certificate/libvirt"


#Clustering
haproxy_dir: "/etc/haproxy"
haproxy_file: "haproxy.cfg"
haproxy_stat_port: '8999'
corosync_config_dir: "/etc/corosync"
corosync_config: "corosync.conf"
cluster_hosts: "{{ groups['controller'] | join (' ') }}"

#Memcached
pac_memcached: "memcached"
pac_python3_memcached: "{{ 'python3-memcache' if ansible_os_family == 'Debian' else 'python3-memcached' }}"
memcached_memory: "2048"
memcached_port: "11211"
memcached_connection: "4096"
memcached_config_dir: "{{ '/etc' if ansible_os_family == 'Debian' else '/etc/sysconfig' }}"
memcached_config: "{{ 'memcached.conf' if ansible_os_family == 'Debian' else 'memcached' }}"

#Percona
pac_percona_pymysql: "{{ 'python3-pymysql' if ansible_os_family == 'Debian' else 'python3-PyMySQL' }}"
pac_percona_mysqldb: "{{ 'python3-mysqldb' if ansible_os_family == 'Debian' else 'python3-PyMySQL' }}"
pac_percona_cluster: "{{ 'percona-xtradb-cluter-57' if percona_version == '5.7' else 'percona-xtradb-cluster' }}"
pac_percona_xtrabackup: "{{ 'percona-xtrabackup-57' if percona_version == '5.7' else 'percona-xtrabackup-80' }}"
mysql_config: "{{ '/etc/mysql/my.cnf' if ansible_os_family == 'Debian' else '/etc/my.cnf' }}"
mysql_bootstrap: "{{ '/etc/init.d/mysql bootstrap-pxc' if percona_version == '5.7' else 'systemctl start mysql@bootstrap' }}"
mysql_unix_socket: "{{ '/var/run/mysqld/mysqld.sock' if ansible_os_family == 'Debian' else '/var/lib/mysql/mysql.sock' }}"
percona_port: "3306"
percona_bind_port: "13306"
percona_version: "8"

#PowerDNS
pdns_schema: "{{ '/usr/share/pdns-backend-mysql/schema/schema.mysql.sql' if ansible_os_family == 'Debian' else '/usr/share/doc/pdns-backend-mysql/schema.mysql.sql' }}"
pdns_config_dir: "{{ '/etc/powerdns/pdns.d' if ansible_os_family == 'Debian' else '/etc/pdns' }}"
pdns_config: "pdns.local.gmysql.conf"

#RabbitMQ
rabbitmq_erlang_cookie: WKRBTTEQRYPTQOPUKSVF
rabbitmq_tls_port: '5671'
rabbitmq_amqp_port: "{{ rabbitmq_tls_port if enable_tls_rabbitmq else '5672' }}"
rabbitmq_epmd_port: '4369'
rabbitmq_node_port: '25672'
rabbitmq_management_port: '15672'
cacertfile_dest: "/etc/ssl/certs/rootCA.pem"
certfile_dest: "/opt/certificate/{{ cloud }}-internal.pem"
keyfile_dest: "/opt/certificate/{{ cloud }}-internal.pem"
tls_fail_if_no_peer_cert: false
tls_verify: "verify_none"
rabbitmq_name: 'openstack'
rabbitmq_create_cluster: true

#Keystone
internal_endpoint_protocol: "{{ 'https' if enable_openstack_tls and enable_tls_internal else 'http' }}"
internal_endpoint: "{{ (internal_fqdn ~ '.' ~ zone_fqdn) if endpoint_type == 'domain' else internal_vip_address }}"
admin_endpoint_protocol: "{{ 'https' if enable_openstack_tls and enable_tls_internal else 'http' }}"
admin_endpoint: "{{ (admin_fqdn ~ '.' ~ zone_fqdn) if endpoint_type == 'domain' else internal_vip_address }}"
public_endpoint_protocol: "{{ 'https' if enable_openstack_tls and enable_tls_external else 'http' }}"
public_endpoint: "{{ (external_fqdn ~ '.' ~ zone_fqdn) if endpoint_type == 'domain' else external_vip_address }}"
pac_keystone: "{{ 'keystone' if ansible_os_family == 'Debian' else 'openstack-keystone' }}"
pac_apache: "{{ 'apache2' if ansible_os_family == 'Debian' else 'httpd' }}"
apache_conf: "{{ '/etc/apache2/apache2.conf' if ansible_os_family == 'Debian' else '/etc/httpd/conf/httpd.conf' }}"
pac_wsgi: "{{ 'libapache2-mod-wsgi-py3' if ansible_os_family == 'Debian' else 'python3-mod_wsgi' }}"
keystone_dir: "/etc/keystone"
keystone_config: "keystone.conf"
keystone_fernet_path_0: "/etc/keystone/fernet-keys/0"
keystone_fernet_path_1: "/etc/keystone/fernet-keys/1"
keystone_credential_path: "/etc/keystone/credential-keys"
cloud_dir: "/etc/openstack"
internal_fqdn_cert: "{{ certificates_dir }}/{{ cloud }}-internal.pem"
external_fqdn_cert: "{{ certificates_dir }}/{{ cloud }}-external.pem"
region_one: "RegionOne"
keystone_port: "5000"
keystone_bind_port: "15000"

#Glance
pac_glance: "{{ 'glance' if ansible_os_family == 'Debian' else 'openstack-glance' }}"
serv_glance: "{{ 'glance-api' if ansible_os_family == 'Debian' else 'openstack-glance-api' }}"
glance_config_dir: "/etc/glance"
glance_config: "glance-api.conf"
glance_store_dir: "/var/lib/glance/images/"
enable_glance_image_cache: "false"
glance_cache_max_size: "10737418240"
glance_port: "9292"
glance_bind_port: "19292"

#Placement
pac_placement: "{{ 'placement-api' if ansible_os_family == 'Debian' else 'openstack-placement-api' }}"
placement_config_dir: "/etc/placement"
placement_config: "placement.conf"
placement_port: "8778"
placement_bind_port: "18778"

#Nova
pac_nova_api: "{{ 'nova-api' if ansible_os_family == 'Debian' else 'openstack-nova-api' }}"
pac_nova_conductor: "{{ 'nova-conductor' if ansible_os_family == 'Debian' else 'openstack-nova-conductor' }}"
pac_nova_scheduler: "{{ 'nova-scheduler' if ansible_os_family == 'Debian' else 'openstack-nova-scheduler' }}"
pac_nova_novncproxy: "{{ 'nova-novncproxy' if ansible_os_family == 'Debian' else 'openstack-nova-novncproxy' }}"
pac_nova_compute: "{{ 'nova-compute' if ansible_os_family == 'Debian' else 'openstack-nova-compute' }}"
pac_libvirt_daemon: "{{ 'libvirt-daemon' if ansible_os_family == 'Debian' else 'libvirt-daemon-kvm' }}"
nova_dir: "/etc/nova"
nova_config: "nova.conf"
nova_compute_config: "nova-compute.conf"
libvirt_dir: "/etc/libvirt"
libvirt_config: "libvirtd.conf"
nova_port: "8774"
nova_bind_port: "18774"
novnc_port: "6080"
novnc_bind_port: "16080"
nova_metadata_port: "8775"
nova_metadata_bind_port: "18775"

#Neutron
pac_neutron: "{{ 'neutron-server' if ansible_os_family == 'Debian' else 'openstack-neutron' }}"
pac_neutron_openvswitch: "{{ 'neutron-openvswitch-agent' if ansible_os_family == 'Debian' else 'openstack-neutron-openvswitch' }}"
pac_openvswitch: "{{ 'openvswitch-switch' if ansible_os_family == 'Debian' else 'openvswitch' }}"
pac_neutron_dhcp_agent: "{{ 'neutron-dhcp-agent' if ansible_os_family == 'Debian' else 'openstack-neutron-ml2' }}"
pac_neutron_l3_agent: "{{ 'neutron-l3-agent' if ansible_os_family == 'Debian' else 'openstack-neutron-ml2' }}"
pac_neutron_metadata_agent: "{{ 'neutron-metadata-agent' if ansible_os_family == 'Debian' else 'openstack-neutron-ml2' }}"
pac_iptables: "{{ 'iptables' if ansible_os_family == 'Debian' else 'ebtables' }}"
neutron_dir: "/etc/neutron"
neutron_plugin_dir: "{{ neutron_dir }}/plugins/ml2"
neutron_config: "neutron.conf"
ml2_config: "ml2_conf.ini"
ovs_config: "openvswitch_agent.ini"
dhcp_config: "dhcp_agent.ini"
metadata_config: "metadata_agent.ini"
l3_config: "l3_agent.ini"
neutron_tenant_type: "vxlan"
neutron_port: "9696"
neutron_bind_port: "19696"

#Cinder
pac_cinder_api: "{{ 'cinder-api' if ansible_os_family == 'Debian' else 'openstack-cinder' }}"
pac_cinder_scheduler: "{{ 'cinder-scheduler' if ansible_os_family == 'Debian' else 'openstack-cinder' }}"
pac_cinder_volume: "{{ 'cinder-volume' if ansible_os_family == 'Debian' else 'openstack-cinder' }}"
pac_cinder_backup: "{{ 'cinder-backup' if ansible_os_family == 'Debian' else 'openstack-cinder' }}"
pac_tgt: "{{ 'tgt' if ansible_os_family == 'Debian' else 'targetcli' }}"
serv_cinder_api: "{{ 'apache2' if ansible_os_family == 'Debian' else 'openstack-cinder-api' }}"
serv_cinder_scheduler: "{{ 'cinder-scheduler' if ansible_os_family == 'Debian' else 'openstack-cinder-scheduler' }}"
serv_cinder_volume: "{{ 'cinder-volume' if ansible_os_family == 'Debian' else 'openstack-cinder-volume' }}"
serv_cinder_backup: "{{ 'cinder-backup' if ansible_os_family == 'Debian' else 'openstack-cinder-backup' }}"
cinder_dir: "/etc/cinder"
cinder_config: "cinder.conf"
cinder_port: "8776"
cinder_bind_port: "18776"

#Horizon
horizon_dir: "/etc/openstack-dashboard"
horizon_config: "{{ 'local_settings.py' if ansible_os_family == 'Debian' else 'local_settings' }}"
horizon_protocol: "{{ 'https' if enable_openstack_tls and enable_horizon_tls else 'http' }}"
horizon_owner: "{{ 'horizon' if ansible_os_family == 'Debian' else 'apache' }}"

#VM-Create
instance_image_path: "/root/ubuntu22.04-3"
instance_image_name: "ubuntu-22.04-qemu.qcow2"
instance_image: "ubuntu_22.04.03"
