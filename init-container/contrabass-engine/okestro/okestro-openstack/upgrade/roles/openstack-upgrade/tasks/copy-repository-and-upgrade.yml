---
- name: Copy Repository configuration files Ubuntu
  become: true
  template:
    src: sources.list.j2
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: 0644
  when: ansible_os_family == "Debian"

- name: apt update && upgrade
  become: true
  apt:
    upgrade: yes
    update_cache: yes
    force_apt_get: yes
  when: ansible_os_family == "Debian"
