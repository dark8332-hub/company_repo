            path: /etc/systemd/system/multi-user.target.wants/cinder-scheduler.service
          register: cinder_scheduler_stat

        - name: Check cinder-volume Service
          stat:
            path: /etc/systemd/system/multi-user.target.wants/cinder-volume.service
          register: cinder_volume_stat

        - name: Check cinder-backup Service
          stat:
            path: /etc/systemd/system/multi-user.target.wants/cinder-backup.service
          register: cinder_backup_stat

        - name: Stop Controller Node Cinder
          service:
            name: "{{ item }}"
            state: stopped
            enabled: no
          with_items:
            - cinder-scheduler
          when: cinder_scheduler_stat.stat.exists

        - name: Stop Controller Node Cinder
          service:
            name: "{{ item }}"
            state: stopped
            enabled: no
          with_items:
            - cinder-volume
          when: cinder_volume_stat.stat.exists

        - name: Stop Controller Node Cinder
          service:
            name: "{{ item }}"
            state: stopped
            enabled: no
          with_items:
            - cinder-backup
          when: cinder_backup_stat.stat.exists

        - name: Delete Controller Node Cinder
          apt:
            name: "{{ item }}"
            state: absent
            purge: true
            autoremove: true
          with_items:
            - cinder-scheduler
            - cinder-volume
            - cinder-backup
            - cinder-api
            - cinder-common
            - python3-cinder
            - python3-cinderclient

        - name: Delete Cinder User
          user:
            name: cinder
            state: absent
            remove: true

        - name: Delete Cinder Group
