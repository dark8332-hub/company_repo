            name: cinder
            state: absent

        - name: Delete Cinder Files
          file:
            path: "{{ item }}"
            state: absent
          with_items:
            - /var/lib/cinder
            - /etc/cinder
            - /var/lock/cinder
            - /var/log/cinder

    - name: Delete Controller Node Neutron
