---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Disable Redhat Purgecluster common OpenStack services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ redhat_purgecluster_common_services }}"
  when:
    - item in ansible_facts.services
    - ansible_facts.services[item].status != 'not-found'
  failed_when: false

- name: Disable Redhat Purgecluster common monitoring services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ purgecluster_common_monitoring_services }}"
  when:
    - item in ansible_facts.services
    - ansible_facts.services[item].status != 'not-found'
  failed_when: false

- name: Find RedHat dnsmasq processes
  ansible.builtin.shell: |
    pgrep -u dnsmasq || true
  register: redhat_dnsmasq_pids
  changed_when: false

- name: Kill RedHat Purgecluster dnsmasq processes
  ansible.builtin.command: "kill -9 {{ item }}"
  loop: "{{ redhat_dnsmasq_pids.stdout_lines }}"
  when: redhat_dnsmasq_pids.stdout != ""

- name: Ensure /etc/dnf/protected.d exists
  ansible.builtin.file:
    path: /etc/dnf/protected.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install contrabass protected packages list
  ansible.builtin.copy:
    src: contrabass-base-pkg.conf
    dest: /etc/dnf/protected.d/contrabass-base-pkg.conf
    owner: root
    group: root
    mode: '0644'

- name: Purge RedHat Purgecluster Common packages 
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: absent
    autoremove: true
  loop: "{{ redhat_purgecluster_common_packages | reject('in', ['firewalld']) | list }}"

- name: Remove original file after copy (only if it exists on the node)
  ansible.builtin.file:
    path: /etc/dnf/protected.d/contrabass-base-pkg.conf
    state: absent

