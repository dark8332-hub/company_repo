- name: Create masakari DB
  mysql_db:
    name: "{{ item.db }}"
    state: present
  with_items:
     - db: masakari 

- name: Update mysql masakari password for all masakari accounts
  no_log: true
  mysql_user:
     name: masakari
     host: "{{ item }}"
     plugin: caching_sha2_password
     plugin_auth_string: "{{ db_password }}"
     priv: masakari.*:ALL,GRANT
     state: present
     update_password: on_create
  with_items:
     - localhost
     - "{{ internal_vip_address.split('.')[:3] | join('.') + '.%' }}" 
