- name: python3-pip install
  apt:
    update-cache: yes
    name: python3-pip
    state: present
  when: ansible_os_family == "Debian"

- name: masakari-dashboard check
  pip_package_info:
    clients: ['pip3']
       #name: masakari-dashboard
  register: masakari_dashboard_check

- name: masakari-dashboard install
  apt:
    update-cache: yes
    name: python3-masakari-dashboard
    state: present
  when:
    - ansible_os_family == "Debian"

