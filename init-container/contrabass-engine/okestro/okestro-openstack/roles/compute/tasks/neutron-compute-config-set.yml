---
- name: Neutron Compute file Settings
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    backup: true
  with_items:
    - { src: "{{ neutron_config }}.j2",dest: "{{ neutron_dir }}/{{ neutron_config }}",owner: "neutron",group: "neutron",mode: "0644" }
    - { src: "openvswitch_agent.ini.j2",dest: "{{ neutron_plugin_dir }}/openvswitch_agent.ini",owner: "neutron",group: "neutron",mode: "0644" }
  register: neutron_compute_conf
  notify: restart neutron-openvswitch-agent

- name: Neutron Agent file Settings
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: "dhcp_agent.ini.j2", dest: "/etc/neutron/dhcp_agent.ini", owner: "neutron", group: "neutron", mode: "0644" }
    - { src: "l3_agent.ini.j2", dest: "/etc/neutron/l3_agent.ini", owner: "neutron", group: "neutron", mode: "0644" }
    - { src: "metadata_agent.ini.j2", dest: "/etc/neutron/metadata_agent.ini", owner: "neutron", group: "neutron", mode: "0644" }
  when: inventory_hostname in groups["neutron_agent"]
