---
- name: Nova Compute file Settings
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    backup: true
  with_items:
    - { src: "{{ nova_config }}.j2",dest: "{{ nova_dir }}/{{ nova_config }}",owner: "nova",group: "nova",mode: "0644" }
  register: nova_compute_conf
  notify: restart nova-compute

- name: Nova Compute virt file Settings
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    backup: true
  with_items:
    - { src: "{{ nova_compute_config }}.j2",dest: "{{ nova_dir }}/{{ nova_compute_config }}",owner: "nova",group: "nova",mode: "0644" }
