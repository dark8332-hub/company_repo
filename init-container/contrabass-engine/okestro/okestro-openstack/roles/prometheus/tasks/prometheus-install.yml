---
- name: Register Prometheus data dir exists
  stat:
    path: '{{ prometheus_data_dir }}'
  register: prometheus_data_dir_svc
  ignore_errors: true

- name: Create Prometheus data dir
  file:
    path: "{{ item.path }}"
    state: "{{ item.state }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  with_items:
    - { path: '{{ prometheus_data_dir }}',state: 'directory',owner: 'root',group: 'root',mode: '0755' }
  when: not prometheus_data_dir_svc.stat.exists

- name: Register Prometheus config dir exists
  stat:
    path: '{{ prometheus_config_dir }}'
  register: prometheus_config_dir_svc
  ignore_errors: true

- name: Create Prometheus config dir
  file:
    path: "{{ item.path }}"
    state: "{{ item.state }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  with_items:
    - { path: '{{ prometheus_config_dir }}',state: 'directory',owner: 'root',group: 'root',mode: '0755' }
    - { path: '{{ prometheus_config_dir }}/rules',state: 'directory',owner: 'root',group: 'root',mode: '0755' }
    - { path: '{{ prometheus_config_dir }}/sd_files',state: 'directory',owner: 'root',group: 'root', mode: '0755' }
  when: not prometheus_config_dir_svc.stat.exists

- name: Copy Prometheus config directory and file
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: 'prometheus_dir/prometheus',dest: '{{ exe_path }}',owner: 'root',group: 'root',mode: '0755' }
    - { src: 'prometheus_dir/promtool',dest: '{{ exe_path }}',owner: 'root',group: 'root',mode: '0755' }
    - { src: 'prometheus_dir/console_libraries',dest: '{{ prometheus_config_dir }}',owner: 'root',group: 'root',mode: '0755' }
    - { src: 'prometheus_dir/consoles',dest: '{{ prometheus_config_dir }}',owner: 'root',group: 'root',mode: '0755' }
    - { src: 'prometheus_dir/prometheus-alert-rules.yml', dest: '{{ prometheus_config_dir }}/rules', owner: 'root', group: 'root', mode: '0644' }

- name: Copy Prometheus web config file
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: 'prometheus-web-config.yml.j2',dest: '{{ prometheus_config_dir }}/web-config.yml',owner: 'root',group: 'root',mode: '0644' }
  when: monitoring_enable_tls == true

- name: Copy Prometheus service and prometheus.yml file
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: 'prometheus.yml.j2',dest: '{{ prometheus_config_dir }}/prometheus.yml',owner: 'root',group: 'root',mode: '0644' }
    - { src: 'prometheus.service.j2',dest: '{{ prometheus_service_daemon_path }}/prometheus.service',owner: 'root',group: 'root',mode: '0644' }
    - { src: 'node-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/node-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'contrabass-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/contrabass-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'openstack-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/openstack-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'memcached-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/memcached-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'mysqld-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/mysqld-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'ha_cluster-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/ha_cluster-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'haproxy-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/haproxy-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'rabbitmq-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/rabbitmq-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'ovs-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/ovs-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'ipmi-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/ipmi-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'contrabass-mole-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/contrabass-mole-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }

- name: Copy Ceph exporter files only if Cinder backend is Ceph
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: 'ceph-exporter.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/ceph-exporter.yaml', owner: 'root', group: 'root', mode: '0644' }
    - { src: 'ceph-mgr.yaml.j2', dest: '{{ prometheus_config_dir }}/sd_files/ceph-mgr.yaml', owner: 'root', group: 'root', mode: '0644' }
  when: cinder_backend == 'ceph'

- name: Copy ceph alert rule file
  copy:
    src: 'ceph_alert.yml'
    dest: "{{ prometheus_config_dir }}/rules/ceph_alert.yml"
    mode: '0644'
    owner: 'root'
    group: 'root'
  when:
    - cinder_backend == 'ceph'


- name: Reload Daemon
  shell: systemctl daemon-reload

- name: Start Prometheus service
  service:
    name: prometheus
    state: restarted
    enabled: true
