---
- name: Create Cinder Service
  openstack.cloud.catalog_service:
    cloud: "{{ cloud }}"
    state: present
    name: cinder
    service_type: volumev3
    description: OpenStack volumev3 Service
    interface: internal

- name: Create Cinder User
  openstack.cloud.identity_user:
    cloud: "{{ cloud }}"
    state: present
    name: cinder
    password: "{{ keystone_pass }}"
    domain: default
    default_project: service
    interface: internal

- name: Cinder user role assignment
  openstack.cloud.role_assignment:
    cloud: "{{ cloud }}"
    user: cinder
    role: admin
    project: service
    interface: internal

- name: Cinder user role assignment service
  openstack.cloud.role_assignment:
    cloud: "{{ cloud }}"
    user: cinder
    role: service
    project: service
    interface: internal

- name: Cinder internal endpoint create
  openstack.cloud.endpoint:
    cloud: "{{ cloud }}"
    service: cinder
    endpoint_interface: "{{ item.interface }}"
    url: "{{ item.interface_protocol }}://{{ item.endpoint }}:{{ cinder_bind_port }}/v3/%(project_id)s"
    region: RegionOne
    state: present
    interface: internal
  with_items:
    - { interface: "internal", interface_protocol: "{{ internal_endpoint_protocol }}", endpoint: "{{ internal_endpoint }}" }
    - { interface: "admin", interface_protocol: "{{ admin_endpoint_protocol }}", endpoint: "{{ admin_endpoint }}" }
    - { interface: "public", interface_protocol: "{{ public_endpoint_protocol }}", endpoint: "{{ public_endpoint }}" }
