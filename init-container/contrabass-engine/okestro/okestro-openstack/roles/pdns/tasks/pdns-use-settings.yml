---
- name: Stop systemd-resolv
  service:
    name: systemd-resolved
    state: stopped
    enabled: no

- name: Delete resolv.conf
  file:
    path: "{{ item }}"
    state: absent
  with_items:
  - /etc/resolv.conf

- name: Create resolv.conf
  template:
    src: "resolv.conf.j2"
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: 0644
