---
- name: Preflight | calculate db_password validation errors
  run_once: true
  delegate_to: localhost
  no_log: true
  vars:
    _db_password: "{{ db_password | default('') | string }}"
  ansible.builtin.set_fact:
    percona_db_password_errors: >-
      {{
        []
        + (
            ['db_password is undefined or empty.']
            if (_db_password | length == 0)
            else []
          )
        + (
            ['minimum length is 8 characters.']
            if (0 < (_db_password | length) < 8)
            else []
          )
        + (
            ['must include at least one uppercase letter [A-Z].']
            if ((_db_password | length > 0) and not (_db_password is ansible.builtin.search('[A-Z]')))
            else []
          )
        + (
            ['must include at least one lowercase letter [a-z].']
            if ((_db_password | length > 0) and not (_db_password is ansible.builtin.search('[a-z]')))
            else []
          )
        + (
            ['must include at least one digit [0-9].']
            if ((_db_password | length > 0) and not (_db_password is ansible.builtin.search('[0-9]')))
            else []
          )
        + (
            ['must include at least one allowed special character: ~ ! ( ) - _ + * &']
            if ((_db_password | length > 0) and not (_db_password is ansible.builtin.search('[-~!()_+*&]')))
            else []
          )
        + (
            ['contains disallowed character(s). Only A-Z, a-z, 0-9, and ~ ! ( ) - _ + * & are allowed.']
            if ((_db_password | length > 0) and not (_db_password is ansible.builtin.search('^[-A-Za-z0-9~!()_+*&]+$')))
            else []
          )
      }}

- name: Preflight | assert db_password complexity
  run_once: true
  delegate_to: localhost
  ansible.builtin.assert:
    that:
      - percona_db_password_errors | length == 0
    quiet: true
    fail_msg: |
      Preflight failed: db_password does not meet the required password policy.
      변수 File : inventory/group_vars/all/main.yml
      변수 명: db_password
      아래 Required rules에 맞제 db_password를 설정 하세요

      Required rules:
      - minimum length: 8
      - at least 1 uppercase letter
      - at least 1 lowercase letter
      - at least 1 digit
      - at least 1 allowed special character
      - allowed special characters only: ~ ! ( ) - _ + * &

      Failed checks:
      {% for item in percona_db_password_errors %}
      - {{ item }}
      {% endfor %}

- name: Preflight | cleanup temporary validation facts
  run_once: true
  delegate_to: localhost
  no_log: true
  ansible.builtin.set_fact:
    percona_db_password_errors: []
