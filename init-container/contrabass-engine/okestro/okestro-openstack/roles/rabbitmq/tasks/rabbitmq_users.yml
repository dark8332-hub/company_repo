---
- name: rabbitmq create user
  no_log: true
  rabbitmq_user:
    user: "{{ rabbitmq_name }}"
    password: "{{ rabbitmq_password }}"
    vhost: /
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    state: present
    tags: administrator
  register: create_user

- name: Remove default RabbitMQ user "guest"
  rabbitmq_user:
    user: guest
    state: absent

