---
- name: Copy rabbitmq default file
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: 0644
  with_items:
    - { src: rabbitmq-server.j2 , dest: /etc/default/rabbitmq-server }
    - { src: rabbitmq.config.j2, dest: /etc/rabbitmq/rabbitmq.config }
  notify:
    restart rabbitmq-server

- name: Copy rabbitmq environment file
  copy:
    src: "{{ item }}"
    dest: "/etc/rabbitmq/{{ item }}"
    mode: '0644'
    owner: 'root'
    group: 'root'
  with_items:
    - 'rabbitmq-env.conf'
    - 'rabbitmq.conf'

- name: Add LimitNOFILE to rabbitmq-server service
  ini_file:
    dest: /usr/lib/systemd/system/rabbitmq-server.service
    section: Service
    option: '{{ item.key }}'
    value: '{{ item.value }}'
  with_dict:
    LimitNOFILE: "65535"
  when: ansible_os_family == "RedHat"

- name: Reload Systemd daemon
  command: systemctl daemon-reload

- name: Rabbitmq restart
  service:
    name: "{{ item }}"
    state: restarted
  with_items:
    - rabbitmq-server
  ignore_errors: true
