---
- name: Octavia file Settings
  template:
    src: "{{ octavia_config }}.j2"
    dest: "{{ octavia_dir}}/{{ octavia_config }}"
    owner: octavia
    group: octavia
    mode: 0644
    backup: true
  register: octavia_conf
  notify:
    - restart octavia-api
    - restart octavia-housekeeping
    - restart octavia-health-manager
    - restart octavia-worker

- include_tasks: octavia-dbsync.yml
  when: inventory_hostname in groups["controller"][0]

- name: Configure Internal Octavia to haproxy.cfg
  blockinfile:
    path: "{{ haproxy_dir }}/{{ haproxy_file }}"
    marker: "## {mark} internal_octavia ##"
    insertbefore: "# public"
    block: |
      listen int_octavia
        bind {{ internal_vip_address }}:{{ octavia_bind_port }} {% if internal_endpoint_protocol == "https" %}ssl crt {{ internal_fqdn_cert }} ssl verify none{% endif %}

        balance  source
        option  tcpka
        option  httpchk
        option  tcplog
      {% for item in groups['controller'] %}
        server {{ hostvars[item]['ansible_hostname'] }} {{ hostvars[item]['ansible_'~int_api_interface].ipv4.address }}:9876 check inter 2000 rise 2 fall 5
      {% endfor %}

- name: Configure External Octavia to haproxy.cfg
  blockinfile:
    path: "{{ haproxy_dir }}/{{ haproxy_file }}"
    marker: "## {mark} external_octavia ##"
    insertbefore: "# monitoring" 
    block: |
      listen pub_octavia
        bind {{ external_vip_address }}:{{ octavia_bind_port }} {% if public_endpoint_protocol == "https" %}ssl crt {{ external_fqdn_cert }} ssl verify none{% endif %}

        balance  source
        option  tcpka
        option  httpchk
        option  tcplog
      {% for item in groups['controller'] %}
        server {{ hostvars[item]['ansible_hostname'] }} {{ hostvars[item]['ansible_'~external_api_interface].ipv4.address }}:9876 check inter 2000 rise 2 fall 5
      {% endfor %}
  when: external_vip_address != internal_vip_address
  
- name: Restart Haproxy
  service:
    name: haproxy
    state: restarted

- name: Octavia-API service log file enable - Ubuntu
  ini_file:
    dest: /usr/lib/systemd/system/octavia-api.service
    section: Service
    option: '{{ item.key }}'
    value: '{{ item.value }}'
  with_dict:
    StandardOutput: "append:/var/log/octavia/octavia-api.log"
    StandardError: "append:/var/log/octavia/octavia-api.log"
  when: ansible_os_family == "Debian"

- name: Octavia-API service log file enable - Suse
  ini_file:
    dest: /usr/lib/systemd/system/octavia-api.service
    section: Service
    option: '{{ item.key }}'
    value: '{{ item.value }}'
  with_dict:
    StandardOutput: "append:/var/log/octavia/api.log"
    StandardError: "append:/var/log/octavia/api.log"
  when: ansible_os_family == "RedHat"

- name: Reload Daemon
  shell: systemctl daemon-reload

- name: octavia Service restart
  service:
    name: "{{ item }}"
    state: restarted
    enabled: true
  with_items:
    - octavia-worker
    - octavia-housekeeping
    - octavia-api
    - octavia-health-manager

- name: Change owner/group of octavia-api log file to octavia for Suse
  ansible.builtin.file:
    path: /var/log/octavia/api.log
    owner: octavia
    group: octavia
  when: ansible_os_family == "RedHat"
