- name: Create Octavia DB
  mysql_db:
    name: octavia
    state: present

- name: Update mysql octavia password for all octavia accounts
  no_log: false
  mysql_user:
     name: octavia
     host: "{{ item }}"
     plugin: caching_sha2_password
     plugin_auth_string: "{{ db_password }}"
     priv: octavia.*:ALL,GRANT
     state: present
     update_password: on_create
  with_items:
     - localhost
     - "{{ internal_vip_address.split('.')[:3] | join('.') + '.%' }}" 
