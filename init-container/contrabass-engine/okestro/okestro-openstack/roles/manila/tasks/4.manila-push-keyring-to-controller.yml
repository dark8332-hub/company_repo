---
- name: Copy client.manila keyring
  copy: 
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: 'ceph.client.manila.keyring',dest: '{{ ceph_dir }}/ceph.client.manila.keyring',owner: 'manila',group: 'manila',mode: '0644' }
