---
- name: Manila user create
  openstack.cloud.identity_user:
    cloud: "{{ cloud }}"
    state: present
    name: manila
    password: "{{ keystone_pass }}"
    domain: default
    interface: internal
    default_project: service

- name: Manila user role assignment
  openstack.cloud.role_assignment:
    cloud: "{{ cloud }}"
    user: manila
    role: admin
    project: service
    interface: internal

- name: Manila user role assignment service
  openstack.cloud.role_assignment:
    cloud: "{{ cloud }}"
    user: manila
    role: service
    project: service
    interface: internal

- name: Create Manila Service v1
  openstack.cloud.catalog_service:
    cloud: "{{ cloud }}"
    state: present
    name: manila
    service_type: share
    interface: internal
    description: OpenStack sharev2 Service

- name: Create Manila Service v2
  openstack.cloud.catalog_service:
    cloud: "{{ cloud }}"
    state: present
    name: manilav2
    service_type: sharev2
    interface: internal
    description: OpenStack sharev2 Service

- name: Manila V2 endpoint create
  openstack.cloud.endpoint:
    cloud: "{{ cloud }}"
    service: "{{ item.service }}"
    endpoint_interface: "{{ item.interface }}"
    url: "{{ item.endpoint_protocol }}://{{ item.endpoint }}:{{ manila_bind_port }}/{{ item.version }}"
    region: RegionOne
    state: present
    interface: internal
  with_items:
    - { service: "manilav2", interface: "internal", endpoint_protocol: "{{ internal_endpoint_protocol }}", endpoint: "{{ internal_endpoint }}", version: "v2" }
    - { service: "manilav2", interface: "admin", endpoint_protocol: "{{ admin_endpoint_protocol }}", endpoint: "{{ admin_endpoint }}", version: "v2" }
    - { service: "manilav2", interface: "public", endpoint_protocol: "{{ public_endpoint_protocol }}", endpoint: "{{ public_endpoint }}", version: "v2" }
    - { service: "manila", interface: "internal", endpoint_protocol: "{{ internal_endpoint_protocol }}", endpoint: "{{ internal_endpoint }}", version: "v1/%(tenant_id)s" }
    - { service: "manila", interface: "admin", endpoint_protocol: "{{ admin_endpoint_protocol }}", endpoint: "{{ admin_endpoint }}", version: "v1/%(tenant_id)s" }
    - { service: "manila", interface: "public", endpoint_protocol: "{{ public_endpoint_protocol }}", endpoint: "{{ public_endpoint }}", version: "v1/%(tenant_id)s" }
