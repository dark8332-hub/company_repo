- name: Create glance service
  openstack.cloud.catalog_service:
    cloud: "{{ cloud }}"
    state: present
    name: glance
    service_type: image
    description: OpenStack Image Service
    interface: internal

- name: Create glance user
  openstack.cloud.identity_user:
    cloud: "{{ cloud }}"   
    state: present
    name: glance
    password: "{{ keystone_pass }}"
    domain: default
    interface: internal
    default_project: service

- name: Glance user role assignment 
  openstack.cloud.role_assignment:
    cloud: "{{ cloud }}"
    user: glance
    role: admin
    project: service
    interface: internal

- name: Glance service role add
  openstack.cloud.role_assignment:
    cloud: "{{ cloud }}"
    user: glance
    role: service
    project: service
    interface: internal

- name: Glance endpoint create
  openstack.cloud.endpoint:
    cloud: "{{ cloud }}"
    service: glance
    endpoint_interface: "{{ item.interface }}"
    url: "{{ item.interface_protocol }}://{{ item.endpoint }}:{{ glance_bind_port }}"
    region: "{{ region_one }}"
    state: present
    interface: internal
  with_items:
    - { interface: "internal", interface_protocol: "{{ internal_endpoint_protocol }}", endpoint: "{{ internal_endpoint }}" }
    - { interface: "admin", interface_protocol: "{{ internal_endpoint_protocol }}", endpoint: "{{ admin_endpoint }}" }
    - { interface: "public", interface_protocol: "{{ public_endpoint_protocol }}", endpoint: "{{ public_endpoint }}" }
