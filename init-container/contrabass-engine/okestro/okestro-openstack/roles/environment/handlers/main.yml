---
- name: chrony_conf is changed 
  service:
    name: "{{ 'chrony' if ansible_facts['os_family'] == 'Debian' else 'chronyd' }}"
    state: restarted

- name: Restart systemd-journald
  service:
    name: systemd-journald
    state: restarted
  notify: Flush journal logs

- name: Flush journal logs
  command: journalctl --flush
  changed_when: false

- name: reload systemd daemon
  systemd:
    daemon_reload: yes
