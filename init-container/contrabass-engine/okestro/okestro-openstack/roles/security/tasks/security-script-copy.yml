---
- name: Copy OS Security Script Files
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    directory_mode:
  with_items:
    - { src: 'os_security',dest: '/root/',owner: 'root',group: 'root',mode: 'preserve' }

- name: Copy MiddleWare Security Script Files
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    directory_mode:
  with_items:
    - { src: 'middleware_security',dest: '/root/',owner: 'root',group: 'root',mode: 'preserve' }
  when: inventory_hostname in groups["controller"]

